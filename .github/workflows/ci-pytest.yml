name: QA checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Collect pytest tests
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://grocerymate.masterschool.com/
      BASE_URL_shop: https://grocerymate.masterschool.com/store
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate test collection without credentials
        run: python -m pytest --collect-only -q
      - name: Run optional Selenium end-to-end tests
        if: github.event_name == 'workflow_dispatch'
        env:
          USERNAME: ${{ secrets.GROCERYMATE_USERNAME }}
          PASSWORD: ${{ secrets.GROCERYMATE_PASSWORD }}
          CHROME_HEADLESS: "true"
        run: |
          if [ -z "${USERNAME:-}" ] || [ -z "${PASSWORD:-}" ]; then
            echo "::notice::Selenium end-to-end tests skipped because demo credentials are not configured."
            exit 0
          fi
          python -m pytest -v
